[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflective-memory"
version = "0.0.1"
description = "Reflective Memory (RM): hierarchical, self-evolving memory for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RM Team" }]
keywords = ["llm", "agent", "memory", "predictive-coding", "self-evolving"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

# Core dependencies — every dev environment needs these.
# Heavyweight / OS-specific extras are split into optional-dependencies below.
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "openai>=1.40",
    "anthropic>=0.34",
    "qdrant-client>=1.10",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "tenacity>=8.5",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "loguru>=0.7",
    "tqdm>=4.66",
    "scikit-learn>=1.5",     # k-means / silhouette as fallback to HDBSCAN
]

[project.optional-dependencies]
# Local embedder. Heavy due to torch.
embed = [
    "sentence-transformers>=3.0",
    "transformers>=4.43",
    "torch>=2.3",
]
# Density-based clustering for Pattern induction. Optional because of binary deps on Win.
cluster = [
    "hdbscan>=0.8.38",
]
# Experiment tracking.
track = [
    "wandb>=0.17",
]
# Test / dev tooling.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "ipython>=8.26",
]
# ALFWorld + ScienceWorld + WebShop. Linux/WSL recommended.
envs = [
    "alfworld>=0.3.5",
    "textworld>=1.6",
]
# Convenience: install everything used in this round (no envs / no cluster).
round1 = [
    "reflective-memory[embed,track,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/reflective-memory"
Documentation = "https://github.com/your-org/reflective-memory/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rm*"]

[tool.setuptools.package-data]
rm = ["llm/prompts/v1/*.txt", "llm/prompts/v1/*.md"]

# --------------------------------------------------------------------------- #
# Tooling configuration                                                        #
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: tests that take more than a few seconds",
    "needs_llm: requires a live LLM endpoint (skipped by default in CI)",
    "needs_qdrant: requires a running Qdrant instance",
    "needs_alfworld: requires alfworld + textworld installed (Linux/WSL)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Scripts inject sys.path before imports — this is the supported pattern.
"scripts/*" = ["E402"]
# Tests use broad pytest.raises(Exception) on purpose to cover validation errors.
"tests/*"   = ["B007", "B017", "B905", "SIM105"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
